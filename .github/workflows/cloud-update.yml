name: Cloud update (results -> settle -> publish)

# Keeps the site current WITHOUT the laptop.
#
# The archive host runs the full pipeline (watch.py, the 1 GB raceform archive,
# the racingtv scrape).  That needs SQL Server and D:\Mydata, so it cannot run
# here - but none of it is required to update this site.  Racing Post's results
# endpoints are plain HTTP and carry everything the app needs: position, SP and
# race_id.  tools/cloud_update.py fetches those, writes them into race_results,
# settles the ledger and repacks the database.
#
# The repo is public, so Actions minutes are free and unlimited.

on:
  schedule:
    # every 2 hours at :17 - a result is collected within ~2h of the off
    - cron: '17 */2 * * *'
  workflow_dispatch:          # the app's "Settle" button dispatches this
    inputs:
      date:
        description: "Settle just this date (YYYY-MM-DD). Blank = recent days."
        required: false
        default: ""
      days:
        description: "How many days back to fetch when no date is given."
        required: false
        default: "4"

permissions:
  contents: write             # needed to push the refreshed db + caches

concurrency:
  group: cloud-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RP_BASE: /tmp/rp          # scratch dir; nothing here needs the archive db
      # rp_fetch sleeps 4s between requests by default.  That is 6 minutes for a
      # 4-day catch-up and is the only reason a run took any real time.  0.3s
      # finishes the same work in ~30s and is still gentle on Racing Post.
      RP_DELAY: '0.3'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # `brotli` is NOT optional: Racing Post replies with content-encoding `br`
        # and rp_fetch.py:138 does a bare `import brotli` with no fallback, so
        # without it every fetch raises ImportError.  pandas is only needed by the
        # settle/mirror steps.
        run: pip install --quiet pandas brotli

      - name: Fetch results, settle, sync
        # With a date: settle exactly that day.  Without: the last few days, which is
        # what the 2-hourly cron wants.
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--date ${{ inputs.date }}"
          else
            ARGS="--days ${{ inputs.days || '4' }}"
          fi
          python -u tools/cloud_update.py $ARGS --apply

      - name: Repack the database
        run: python tools/pack_db.py

      - name: Publish the database as a release asset
        # The database leaves git here.  Committing a ~29 MB binary every 2 hours was
        # ~350 MB a day of history, and - worse - the laptop pipeline and this Action
        # both wrote that one file, so their branches diverged and each could
        # overwrite the other's settlement (it nearly destroyed a night of results on
        # 2026-09-24).  A release asset is a single slot that gets REPLACED, so there
        # is no history to bloat and no rebase that can lose data.
        #
        # --untrack runs `git rm --cached racing_form.db.gz` only after the upload
        # succeeds, so the app is never left with neither source.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/publish_release_asset.py --untrack

      - name: Commit and push
        run: |
          git config user.name  "cloud-update[bot]"
          git config user.email "cloud-update@users.noreply.github.com"
          # racing_form.db.gz is deliberately NOT added - publish_release_asset.py
          # already untracked it, and re-adding it here would undo that.  It is in
          # .gitignore too, so nothing can stage it by accident.
          git add results_ledger.csv
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore(cloud): results + settlement $(date -u +'%Y-%m-%d %H:%M')"
          # intraday_odds.yml runs every 5 minutes and commits snapshots/, so a bare
          # `git push` gets rejected as non-fast-forward whenever it lands between
          # our checkout and our push.  retry with a rebase, same as the other two
          # workflows do.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          echo "could not push after 5 attempts"
          exit 1
